<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 456" role="img" aria-labelledby="01-same-blank-different-context-mobile-title 01-same-blank-different-context-mobile-desc"><title id="01-same-blank-different-context-mobile-title">앞말에 따라 떠오르는 답</title><desc id="01-same-blank-different-context-mobile-desc">여름에는 찬 음료, 겨울에는 따뜻한 음식이 떠오를 수 있다는 문장 예시.</desc><defs><marker id="01-same-blank-different-context-mobile-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="01-same-blank-different-context-mobile-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="01-same-blank-different-context-mobile-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><style>text{font-family:Geist,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#2d3142}</style><rect width="360" height="456" fill="#f5f5f5"/><text x="24" y="36" text-anchor="start" font-size="16" font-weight="400">문장 이어 쓰기 예시</text><rect x="24" y="64" width="312" height="160" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="180.0" y="124.0" text-anchor="middle" font-size="18" font-weight="600">한여름에 걷다가</text><text x="180.0" y="150.0" text-anchor="middle" font-size="18" font-weight="400">시원한 ___</text><text x="180.0" y="176.0" text-anchor="middle" font-size="18" font-weight="400">물 또는 아이스커피</text><rect x="24" y="256" width="312" height="160" rx="6" fill="#faece5" stroke="#eb6c36"/><text x="180.0" y="316.0" text-anchor="middle" font-size="18" font-weight="600">한겨울에 걷다가</text><text x="180.0" y="342.0" text-anchor="middle" font-size="18" font-weight="400">따뜻한 ___</text><text x="180.0" y="368.0" text-anchor="middle" font-size="18" font-weight="400">차 또는 국물</text></svg>
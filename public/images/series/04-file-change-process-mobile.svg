<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 688" role="img" aria-labelledby="04-file-change-process-mobile-title 04-file-change-process-mobile-desc"><title id="04-file-change-process-mobile-title">수정 결과를 검사하는 절차</title><desc id="04-file-change-process-mobile-desc">결과 검사에 통과하면 완료하고 실패하면 수정으로 돌아간다. 반복 한도에 도달하면 중단한다.</desc><defs><marker id="04-file-change-process-mobile-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="04-file-change-process-mobile-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="04-file-change-process-mobile-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><style>text{font-family:Geist,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#2d3142}</style><rect width="360" height="688" fill="#f5f5f5"/><text x="24" y="36" text-anchor="start" font-size="16" font-weight="400">파일 수정 절차 예시</text><path d="M168 120V160" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#04-file-change-process-mobile-arrow)"/><path d="M168 224V264" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#04-file-change-process-mobile-arrow)"/><path d="M168 328V400" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#04-file-change-process-mobile-arrow)"/><path d="M168 464V544" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#04-file-change-process-mobile-arrow)"/><path d="M288 432H320Q328 432 328 424V304Q328 296 320 296H288" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#04-file-change-process-mobile-arrow)"/><rect x="269" y="350" width="50" height="24" fill="#f5f5f5"/><text x="294" y="368" text-anchor="middle" font-size="16" font-weight="400">실패</text><rect x="183" y="490" width="50" height="24" fill="#f5f5f5"/><text x="208" y="508" text-anchor="middle" font-size="16" font-weight="400">통과</text><rect x="48" y="64" width="240" height="56" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="168.0" y="98.0" text-anchor="middle" font-size="18" font-weight="600">요청</text><rect x="48" y="160" width="240" height="64" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="168.0" y="198.0" text-anchor="middle" font-size="18" font-weight="600">허용 파일 읽기</text><rect x="48" y="264" width="240" height="64" rx="6" fill="#faece5" stroke="#eb6c36"/><text x="168.0" y="302.0" text-anchor="middle" font-size="18" font-weight="600">수정</text><rect x="48" y="400" width="240" height="64" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="168.0" y="438.0" text-anchor="middle" font-size="18" font-weight="600">결과 검사</text><rect x="48" y="544" width="240" height="64" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="168.0" y="582.0" text-anchor="middle" font-size="18" font-weight="600">완료</text><text x="24" y="656" text-anchor="start" font-size="16" font-weight="400">반복 한도에 도달하면 중단합니다.</text></svg>
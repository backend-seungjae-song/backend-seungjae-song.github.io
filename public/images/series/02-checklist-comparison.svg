<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" role="img" aria-labelledby="02-checklist-comparison-title 02-checklist-comparison-desc"><title id="02-checklist-comparison-title">두 지시의 결과 비교</title><desc id="02-checklist-comparison-desc">같은 자료를 기본 지시와 확인 항목을 더한 지시로 각각 검토하고 답변을 비교한다.</desc><defs><marker id="02-checklist-comparison-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="02-checklist-comparison-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="02-checklist-comparison-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><style>text{font-family:Geist,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#2d3142}</style><rect width="720" height="348" fill="#f5f5f5"/><text x="24" y="36" text-anchor="start" font-size="16" font-weight="400">같은 모델과 자료로 지시 비교</text><path d="M192 140H216Q224 140 224 132V128Q224 120 232 120H264" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#02-checklist-comparison-arrow)"/><path d="M192 220H216Q224 220 224 228V256Q224 264 232 264H264" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#02-checklist-comparison-arrow)"/><path d="M480 120H516Q524 120 524 128V176Q524 184 532 184H560" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#02-checklist-comparison-arrow)"/><path d="M480 264H516Q524 264 524 256V224Q524 216 532 216H560" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#02-checklist-comparison-arrow)"/><rect x="24" y="100" width="168" height="160" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="108.0" y="173.0" text-anchor="middle" font-size="18" font-weight="600">같은 자료</text><text x="108.0" y="199.0" text-anchor="middle" font-size="18" font-weight="400">입력 고정</text><rect x="264" y="72" width="216" height="96" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="372.0" y="126.0" text-anchor="middle" font-size="18" font-weight="600">기본 지시</text><rect x="264" y="216" width="216" height="96" rx="6" fill="#faece5" stroke="#eb6c36"/><text x="372.0" y="270.0" text-anchor="middle" font-size="18" font-weight="600">확인 항목 추가</text><rect x="560" y="156" width="136" height="96" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="628.0" y="197.0" text-anchor="middle" font-size="18" font-weight="600">답변 비교</text><text x="628.0" y="223.0" text-anchor="middle" font-size="18" font-weight="400">누락과 오류</text></svg>
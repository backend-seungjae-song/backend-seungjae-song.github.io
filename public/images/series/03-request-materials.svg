<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" role="img" aria-labelledby="03-request-materials-title 03-request-materials-desc"><title id="03-request-materials-title">자료를 고르고 답변 확인</title><desc id="03-request-materials-desc">현재 질문에 필요한 원문과 이전 대화를 고르고 충돌을 확인한 뒤 전달하며 답변의 누락과 오류를 확인한다.</desc><defs><marker id="03-request-materials-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="03-request-materials-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="03-request-materials-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><style>text{font-family:Geist,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#2d3142}</style><rect width="720" height="344" fill="#f5f5f5"/><text x="24" y="36" text-anchor="start" font-size="16" font-weight="400">질문과 함께 전달할 자료</text><path d="M216 180H260" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#03-request-materials-arrow)"/><path d="M464 180H508" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#03-request-materials-arrow)"/><rect x="24" y="76" width="192" height="208" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="120.0" y="160.0" text-anchor="middle" font-size="18" font-weight="600">현재 질문</text><text x="120.0" y="186.0" text-anchor="middle" font-size="18" font-weight="400">필요한 원문</text><text x="120.0" y="212.0" text-anchor="middle" font-size="18" font-weight="400">관련 이전 대화</text><rect x="260" y="108" width="204" height="144" rx="6" fill="#faece5" stroke="#eb6c36"/><text x="362.0" y="173.0" text-anchor="middle" font-size="18" font-weight="600">충돌 여부 확인</text><text x="362.0" y="199.0" text-anchor="middle" font-size="18" font-weight="400">옛 선호와 현재 요청</text><rect x="508" y="108" width="188" height="144" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="602.0" y="160.0" text-anchor="middle" font-size="18" font-weight="600">자료 전달</text><text x="602.0" y="186.0" text-anchor="middle" font-size="18" font-weight="400">답변 확인</text><text x="602.0" y="212.0" text-anchor="middle" font-size="18" font-weight="400">누락과 오류</text></svg>
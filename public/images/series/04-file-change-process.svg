<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" role="img" aria-labelledby="04-file-change-process-title 04-file-change-process-desc"><title id="04-file-change-process-title">수정 결과를 검사하는 절차</title><desc id="04-file-change-process-desc">허용된 파일을 읽고 수정한 뒤 검사하며 통과하면 완료하고 실패하면 수정 단계로 돌아간다.</desc><defs><marker id="04-file-change-process-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="04-file-change-process-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="04-file-change-process-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><style>text{font-family:Geist,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#2d3142}</style><rect width="720" height="328" fill="#f5f5f5"/><text x="24" y="36" text-anchor="start" font-size="16" font-weight="400">파일 수정 절차 예시</text><path d="M120 128H152" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#04-file-change-process-arrow)"/><path d="M280 128H312" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#04-file-change-process-arrow)"/><path d="M408 128H448" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#04-file-change-process-arrow)"/><path d="M568 128H600" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#04-file-change-process-arrow)"/><path d="M508 160V232Q508 240 500 240H368Q360 240 360 232V160" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#04-file-change-process-arrow)"/><rect x="559" y="82" width="50" height="24" fill="#f5f5f5"/><text x="584" y="100" text-anchor="middle" font-size="16" font-weight="400">통과</text><rect x="411" y="204" width="50" height="24" fill="#f5f5f5"/><text x="436" y="222" text-anchor="middle" font-size="16" font-weight="400">실패</text><rect x="24" y="96" width="96" height="64" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="72.0" y="134.0" text-anchor="middle" font-size="18" font-weight="600">요청</text><rect x="152" y="96" width="128" height="64" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="216.0" y="121.0" text-anchor="middle" font-size="18" font-weight="600">허용 파일</text><text x="216.0" y="147.0" text-anchor="middle" font-size="18" font-weight="400">읽기</text><rect x="312" y="96" width="96" height="64" rx="6" fill="#faece5" stroke="#eb6c36"/><text x="360.0" y="134.0" text-anchor="middle" font-size="18" font-weight="600">수정</text><rect x="448" y="96" width="120" height="64" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="508.0" y="134.0" text-anchor="middle" font-size="18" font-weight="600">결과 검사</text><rect x="600" y="96" width="96" height="64" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="648.0" y="134.0" text-anchor="middle" font-size="18" font-weight="600">완료</text><text x="24" y="296" text-anchor="start" font-size="16" font-weight="400">반복 한도에 도달하면 중단하고 남은 문제를 확인합니다.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" role="img" aria-labelledby="01-same-blank-different-context-title 01-same-blank-different-context-desc"><title id="01-same-blank-different-context-title">앞말에 따라 떠오르는 답</title><desc id="01-same-blank-different-context-desc">여름에는 찬 음료, 겨울에는 따뜻한 음식이 떠오를 수 있다는 문장 예시.</desc><defs><marker id="01-same-blank-different-context-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="01-same-blank-different-context-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="01-same-blank-different-context-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><style>text{font-family:Geist,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#2d3142}</style><rect width="720" height="288" fill="#f5f5f5"/><text x="24" y="36" text-anchor="start" font-size="16" font-weight="400">문장 이어 쓰기 예시</text><rect x="24" y="72" width="324" height="160" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="186.0" y="132.0" text-anchor="middle" font-size="18" font-weight="600">한여름에 걷다가</text><text x="186.0" y="158.0" text-anchor="middle" font-size="18" font-weight="400">시원한 ___</text><text x="186.0" y="184.0" text-anchor="middle" font-size="18" font-weight="400">물 또는 아이스커피</text><rect x="372" y="72" width="324" height="160" rx="6" fill="#faece5" stroke="#eb6c36"/><text x="534.0" y="132.0" text-anchor="middle" font-size="18" font-weight="600">한겨울에 걷다가</text><text x="534.0" y="158.0" text-anchor="middle" font-size="18" font-weight="400">따뜻한 ___</text><text x="534.0" y="184.0" text-anchor="middle" font-size="18" font-weight="400">차 또는 국물</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="02-checklist-comparison-mobile-title 02-checklist-comparison-mobile-desc"><title id="02-checklist-comparison-mobile-title">두 지시의 결과 비교</title><desc id="02-checklist-comparison-mobile-desc">같은 자료를 두 지시에 각각 적용하고 두 답변의 누락과 오류를 비교한다.</desc><defs><marker id="02-checklist-comparison-mobile-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="02-checklist-comparison-mobile-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="02-checklist-comparison-mobile-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><style>text{font-family:Geist,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#2d3142}</style><rect width="360" height="480" fill="#f5f5f5"/><text x="24" y="36" text-anchor="start" font-size="16" font-weight="400">같은 모델과 자료로 지시 비교</text><path d="M104 136V152Q104 160 96 160H98Q90 160 90 168V192" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#02-checklist-comparison-mobile-arrow)"/><path d="M256 136V152Q256 160 264 160H262Q270 160 270 168V192" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#02-checklist-comparison-mobile-arrow)"/><path d="M90 288V316Q90 324 98 324H116Q124 324 124 332V360" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#02-checklist-comparison-mobile-arrow)"/><path d="M270 288V316Q270 324 262 324H244Q236 324 236 332V360" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#02-checklist-comparison-mobile-arrow)"/><rect x="60" y="64" width="240" height="72" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="180.0" y="106.0" text-anchor="middle" font-size="18" font-weight="600">같은 자료</text><rect x="16" y="192" width="148" height="96" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="90.0" y="246.0" text-anchor="middle" font-size="18" font-weight="600">기본 지시</text><rect x="196" y="192" width="148" height="96" rx="6" fill="#faece5" stroke="#eb6c36"/><text x="270.0" y="233.0" text-anchor="middle" font-size="18" font-weight="600">확인 항목</text><text x="270.0" y="259.0" text-anchor="middle" font-size="18" font-weight="400">추가</text><rect x="60" y="360" width="240" height="88" rx="6" fill="#fff" stroke="#bfc0c0"/><text x="180.0" y="397.0" text-anchor="middle" font-size="18" font-weight="600">각각의 답변 비교</text><text x="180.0" y="423.0" text-anchor="middle" font-size="18" font-weight="400">누락과 오류</text></svg>